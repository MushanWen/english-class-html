<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light">
<title>Unit 3 · 每日认读词｜10月12—18日</title>
<style>
:root{--paper:#f4efe5;--white:#fffaf2;--ink:#25342d;--m:#637166;--line:#d7d3c6;--green:#315d4c;--rust:#a55137;--soft:#e8ece4;--gold:#f7e5ba;--serif:Georgia,"Times New Roman","Songti SC","STSong",serif;--sans:system-ui,"Microsoft YaHei",sans-serif}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:var(--serif);color:var(--ink);background:var(--paper)}button{font-family:var(--sans);font-size:16px;cursor:pointer;border:1px solid var(--line);border-radius:9px;background:var(--white);color:var(--ink);min-height:42px;padding:8px 14px}button:hover{border-color:var(--green)}button:focus-visible{outline:3px solid var(--rust);outline-offset:2px}button:disabled{opacity:.35;cursor:default}.primary{color:#fff;background:var(--green);border-color:var(--green)}.active{color:#fff;background:var(--ink);border-color:var(--ink)}button.small{font-size:14px;padding:5px 10px;min-height:33px}.shell{height:100dvh;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;max-width:2000px;margin:0 auto}.top{padding:14px 3vw 9px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);gap:16px}.eyebrow{font:700 12px var(--sans);letter-spacing:.15em;color:var(--rust)}.top h1{font-size:clamp(25px,2.35vw,39px);line-height:1.12;margin:3px 0;font-weight:650}.asidehead{display:flex;gap:10px;align-items:center}.dateline{font:600 15px var(--sans);color:var(--m)}.daybar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 3vw;border-bottom:1px solid var(--line)}.days{display:flex;gap:7px;flex-wrap:wrap}.day-btn{min-width:76px;font-size:15px}.tools{display:flex;gap:7px}.body{padding:13px 3vw 12px;min-height:0;overflow:auto}.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 11px}.section-head h2{font-size:clamp(21px,2vw,32px);font-weight:600;margin:0}.section-head p{font:16px var(--sans);color:var(--m);margin:0}.board{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;min-height:0}.pane{background:var(--white);border:1px solid var(--line);border-top:4px solid var(--green);padding:14px 17px 13px;min-width:0}.pane.listen{border-top-color:var(--rust)}.pane h3{font:700 15px var(--sans);letter-spacing:.04em;color:var(--rust);margin:0 0 10px}.word{border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:9px 0;align-items:center}.word:last-child{border-bottom:none}.en{font-size:clamp(24px,2.1vw,36px);line-height:1.1;font-weight:650;overflow-wrap:anywhere}.subtext{font-size:clamp(17px,1.2vw,23px);margin-top:4px;line-height:1.3;color:var(--m)}.zh{color:var(--green);font-weight:650}.src{font:12px var(--sans);color:#8c9188;margin-left:7px;white-space:nowrap}.speaker-btn{white-space:nowrap;min-width:60px}.review{margin-top:12px;border-top:1px solid var(--line);padding-top:11px}.review-list{display:grid;grid-template-columns:1fr 1fr;gap:7px}.review-item{display:flex;justify-content:space-between;gap:5px;align-items:center;background:var(--soft);padding:7px 10px;font-size:clamp(19px,1.45vw,25px);font-weight:650}.review-item small{font:14px var(--sans);color:var(--m)}.foot{height:64px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:14px;align-items:center;padding:8px 3vw}.foot .side{display:flex;gap:10px;align-items:center}.note{font:15px var(--sans);color:var(--m)}.button-hold{position:relative;overflow:hidden;touch-action:manipulation;user-select:none}.holdbar{position:absolute;bottom:0;left:0;top:auto;height:4px;background:var(--rust);width:0;pointer-events:none}.btn-big{font-size:18px;min-width:110px}.exam{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px;min-height:54vh;align-items:stretch}.examcard{border:1px solid var(--line);border-top:5px solid var(--green);background:var(--white);padding:24px;display:flex;flex-direction:column;justify-content:space-between;min-width:0}.examcard:last-child{border-top-color:var(--rust)}.qno{font:700 16px var(--sans);color:var(--rust)}.prompt{font-size:clamp(30px,2.8vw,48px);font-weight:650;line-height:1.2;overflow-wrap:anywhere}.examanswer{font-size:clamp(24px,2.3vw,36px);color:var(--green);margin:14px 0 0;min-height:1.5em}.examactions{display:flex;gap:8px;flex-wrap:wrap}.weekend{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.weekword{padding:11px 14px;background:var(--white);border-bottom:1px solid var(--line);font-size:clamp(20px,1.7vw,29px);font-weight:650;min-width:0}.weekword .subtext{font-size:clamp(14px,1vw,18px)}.alert{font:15px var(--sans);color:var(--rust);margin-top:12px}.printonly{display:none}.status{font:14px var(--sans);color:var(--m)}
@media(max-width:1050px){.day-btn{min-width:55px;padding:7px}.board{grid-template-columns:1.12fr 1fr}.en{font-size:25px}.subtext{font-size:17px}.pane{padding:12px}.review-item{font-size:19px}.src{display:none}.daybar{align-items:flex-start;flex-wrap:wrap}.weekend{grid-template-columns:1fr 1fr}}
@media(max-width:650px){html,body{overflow:auto;height:auto}.shell{height:auto;min-height:100dvh;display:flex;flex-direction:column}.top{padding:15px}.asidehead{display:none}.daybar{padding:10px 15px}.days{display:grid;grid-template-columns:repeat(4,1fr);width:100%}.day-btn{min-width:0;padding:5px;font-size:14px}.tools{width:100%}.body{padding:12px 15px;overflow:visible}.board,.exam{grid-template-columns:1fr}.en{font-size:28px}.subtext{font-size:20px}.review-list{grid-template-columns:1fr 1fr}.exam{min-height:0}.examcard{min-height:240px}.weekend{grid-template-columns:1fr}.foot{position:sticky;bottom:0;background:var(--paper);height:auto;padding:10px 15px;flex-wrap:wrap}.note{display:none}}
@media print{@page{size:A4 portrait;margin:12mm}html,body{height:auto;overflow:visible!important;background:#fff}#app{display:none!important}.printonly{display:block!important;font-family:"Times New Roman","SimSun",serif;color:#111}.printtitle{font-size:22pt;margin:0 0 6pt}.printsub{font-size:10pt;margin-bottom:14pt}.printgrid{display:grid;grid-template-columns:1fr 1fr;column-gap:9mm;row-gap:8pt}.printday:nth-child(5){grid-column:1/-1}.printday{break-inside:avoid;border-top:1.5pt solid #333;padding-top:6pt;margin-bottom:12pt}.printday h2{font-size:12pt;margin:0 0 5pt}.printrow{display:grid;grid-template-columns:1fr auto;gap:7pt;border-bottom:.3pt solid #bbb;padding:2pt 0}.printeng{font-size:10.6pt;font-weight:700}.printipa{font-size:8.5pt;color:#555}.printzh{font-size:9.3pt;text-align:right}.printfoot{margin-top:12pt;font-size:10pt;line-height:1.65}}
</style></head><body>
<div class="shell" id="app"><header class="top"><div><div class="eyebrow">UNIT 3 · SMART LEARNING</div><h1>每日词汇认读 · 10月12—18日</h1></div><div class="asidehead"><span class="dateline">两班每日同步 · 见词知义 / 听音知义</span><button id="print">打印整周词表</button></div></header>
<div class="daybar"><div class="days" id="days"></div><div class="tools"><button class="active" id="learn">领读 / 自背</button><button id="quiz">随机过关</button></div></div><main class="body" id="content" aria-live="polite"></main><footer class="foot"><div class="side"><button id="prev" class="button-hold btn-big" aria-label="长按上一天">← 上一天<span class="holdbar"></span></button><span class="note">长按约0.7秒翻天</span></div><div class="side"><span class="status" id="status">看英文说中文；听音词先听再说</span><button id="next" class="button-hold btn-big" aria-label="长按下一天">下一天 →<span class="holdbar"></span></button></div></footer></div>
<div class="printonly" id="paper"><h1 class="printtitle">Unit 3 · 每日认读词</h1><div class="printsub">10月12—18日｜只要求认读，不要求拼写。课堂领读后，课下记忆，找老师过关。</div><div class="printgrid" id="printgrid"></div><div class="printfoot">周六：复习周一至周三18个新项目；周日：复习周四至周五12个新项目。<br>阅读词：看英文说中文；听力词：听到发音说中文。当天随机抽查3项。</div></div>
<script>
"use strict";
const DATA=[{"d":"10.12","day":"周一","topic":"学习方法 · p.22","read":[["flashcard","ˈflæʃkɑːd","单词卡；抽认卡","p.22"],["website","ˈwebsaɪt","网站","p.22"],["hands-on","ˌhændz ˈɒn","动手操作的","p.22"],["experiment","ɪkˈsperɪmənt","实验；试验","p.22"]],"listen":[["weak point","ˌwiːk ˈpɔɪnt","薄弱点","听力原文 p.96"],["timeline","ˈtaɪmlaɪn","时间线；时间轴","听力原文 p.96"]],"review":[]},{"d":"10.13","day":"周二","topic":"学习英语 · p.23","read":[["dialogue","ˈdaɪəlɒɡ","对话；对白","p.23"],["level","ˈlevəl","水平；级别","p.23"],["suit","suːt","适合","p.23"],["in general","ɪn ˈdʒenrəl","总的来说；通常","p.23"]],"listen":[["note down","nəʊt daʊn","记下","听力原文 p.97"],["meaningful","ˈmiːnɪŋfəl","有意义的","听力原文 p.97"]],"review":["flashcard","website","weak point","timeline"]},{"d":"10.14","day":"周三","topic":"主动学习 · p.24","read":[["podcast","ˈpɒdkɑːst","播客","p.24"],["strategy","ˈstrætədʒi","策略","p.24"],["come across","kʌm əˈkrɒs","偶然遇见；发现","p.24"],["step by step","step baɪ step","逐步地；循序渐进地","p.24"]],"listen":[["zero","ˈzɪərəʊ","零；从零开始","p.24"],["build up","bɪld ʌp","逐步增加；加强","p.24"]],"review":["experiment","hands-on","dialogue","note down"]},{"d":"10.15","day":"周四","topic":"语法与词汇 · p.25—28","read":[["summarize","ˈsʌməraɪz","总结；概括","p.25"],["pronunciation","prəˌnʌnsiˈeɪʃən","发音；读音","p.28"],["examination","ɪɡˌzæmɪˈneɪʃən","考试","p.28"],["in addition","ɪn əˈdɪʃən","此外；另外","p.26、28"]],"listen":[["provide","prəˈvaɪd","提供","p.28"],["guidance","ˈɡaɪdəns","指导","p.26、28"]],"review":["podcast","come across","suit","meaningful"]},{"d":"10.16","day":"周五","topic":"阅读习惯 · p.29","read":[["newspaper","ˈnjuːzpeɪpə(r)","报纸","p.29"],["magazine","ˌmæɡəˈziːn","杂志；期刊","p.29"],["shelf","ʃelf","架子；搁板","p.29"],["e-book","ˈiː bʊk","电子书","p.29"]],"listen":[["prefer","prɪˈfɜː(r)","更喜欢","p.29"],["recent","ˈriːsənt","最近的；最新的","p.29"]],"review":["pronunciation","examination","step by step","zero"]}];
const $=id=>document.getElementById(id);
const vocab={};DATA.forEach(d=>[...d.read,...d.listen].forEach(w=>vocab[w[0]]=w));
const weekend=[{d:"10.17",day:"周六",topic:"复习周一—周三 · 18项",list:DATA.slice(0,3).flatMap(d=>[...d.read,...d.listen])},{d:"10.18",day:"周日",topic:"复习周四—周五 · 12项",list:DATA.slice(3,5).flatMap(d=>[...d.read,...d.listen])}];
let day=0,mode="learn",questions=[],revealed=new Set(),readChecks=new Set();
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function items(){return day<5?[...DATA[day].read,...DATA[day].listen,...DATA[day].review.map(s=>vocab[s])]:weekend[day-5].list}
function escapeWord(w){return esc(w[0])}
function choose(xs,n){const a=[...xs];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a.slice(0,n)}
function newQuiz(){const current=items();let seeing,hearing;if(day<5){const a=[...DATA[day].read,...DATA[day].review.map(s=>vocab[s])];seeing=choose(a,2);hearing=choose(DATA[day].listen,1)}else{seeing=choose(current,2);hearing=choose(current.filter((w,i)=>i%3===0),1)}questions=[...seeing.map(w=>({w,sound:false})),...hearing.map(w=>({w,sound:true}))];revealed=new Set()}
function speak(s){try{if(!("speechSynthesis" in window)){setStatus("当前浏览器无法播放；请教师领读");return}window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s);u.lang="en-GB";u.rate=.78;u.pitch=1;const voices=window.speechSynthesis.getVoices();const v=voices.find(v=>v.lang.toLowerCase()==="en-gb")||voices.find(v=>v.lang.toLowerCase().startsWith("en"));if(v)u.voice=v;u.onerror=()=>setStatus("音频不可用，请教师领读");window.speechSynthesis.speak(u)}catch(e){setStatus("音频不可用，请教师领读")}}
function setStatus(s){$("status").textContent=s}
function drawDays(){const all=[...DATA,...weekend];$("days").innerHTML=all.map((d,i)=>'<button class="day-btn '+(i===day?'active':'')+'" data-day="'+i+'">'+esc(d.day)+' '+esc(d.d)+'</button>').join("")}
function wordCard(w){return '<div class="word"><div><div class="en">'+escapeWord(w)+'</div><div class="subtext">/'+esc(w[1])+'/　<span class="zh">'+esc(w[2])+'</span> <span class="src">'+esc(w[3])+'</span></div></div><button class="small speaker-btn" data-speak="'+esc(w[0])+'" aria-label="朗读 '+esc(w[0])+'">▶ 发音</button></div>'}
function drawLearning(){const d=DATA[day],r=d.review.map(s=>vocab[s]);return '<div class="section-head"><h2>'+esc(d.day)+' · '+esc(d.topic)+'</h2><p>6个新项目'+(r.length?' + 4个复习':'')+'</p></div><div class="board"><section class="pane"><h3>01｜阅读词汇 · 见词知义</h3>'+d.read.map(wordCard).join("")+'</section><section class="pane listen"><h3>02｜听力词汇 · 听音知义</h3>'+d.listen.map(wordCard).join("")+(r.length?'<div class="review"><h3>03｜旧词复习</h3><div class="review-list">'+r.map(w=>'<div class="review-item"><span>'+escapeWord(w)+'</span><small>'+esc(w[2])+'</small></div>').join("")+'</div></div>':'<div class="review"><h3>课下任务</h3><div class="subtext">遮住汉语回忆词义，找老师抽查3项。</div></div>')+'</section></div>'}
function drawWeekend(){const d=weekend[day-5];return '<div class="section-head"><h2>'+esc(d.day)+' · '+esc(d.topic)+'</h2><p>不增加新词</p></div><div class="weekend">'+d.list.map(w=>'<div class="weekword">'+escapeWord(w)+'<div class="subtext">/'+esc(w[1])+'/　<span class="zh">'+esc(w[2])+'</span></div></div>').join("")+'</div>'}
function drawQuiz(){if(!questions.length)newQuiz();return '<div class="section-head"><h2>随机过关 · '+esc(([...DATA,...weekend][day]).day)+'</h2><div><button class="primary" id="newset">下一组3题</button></div></div><div class="exam">'+questions.map((q,i)=>{const w=q.w,on=revealed.has(i);return '<section class="examcard"><div class="qno">'+(i+1)+' / 3　'+(q.sound?'听音说中文':'看词说中文')+'</div><div class="prompt">'+(q.sound?'<button class="primary" data-play="'+esc(w[0])+'">▶ 播放发音</button>':'<span>'+escapeWord(w)+'</span>')+'</div><div class="examanswer">'+(on?(q.sound?'<div>'+escapeWord(w)+'</div>':'')+esc(w[2]):'　')+'</div><div class="examactions"><button data-reveal="'+i+'">'+(on?'隐藏答案':'核对答案')+'</button></div></section>'}).join("")+'</div><div class="alert">听音题需开启浏览器声音；如无可用英语语音，由教师读出该词。</div>'}
function render(){drawDays();$("learn").classList.toggle("active",mode==="learn");$("quiz").classList.toggle("active",mode==="quiz");$("prev").disabled=day===0;$("next").disabled=day===6;$("content").innerHTML=mode==="quiz"?drawQuiz():day<5?drawLearning():drawWeekend();setStatus(mode==="quiz"?"每人随机3题，答对即过关":"看英文说中文；听音词先听再说")}
function navigate(n){if(n<0||n>6)return;day=n;mode="learn";questions=[];render()}
$("days").addEventListener("click",e=>{const b=e.target.closest("[data-day]");if(b)navigate(+b.dataset.day)});
$("learn").onclick=()=>{mode="learn";render()};
$("quiz").onclick=()=>{mode="quiz";newQuiz();render()};
$("content").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.speak)speak(b.dataset.speak);else if(b.dataset.play)speak(b.dataset.play);else if(b.dataset.reveal!==undefined){let i=+b.dataset.reveal;revealed.has(i)?revealed.delete(i):revealed.add(i);render()}else if(b.id==="newset"){newQuiz();render()}});
$("print").onclick=()=>window.print();
for(const [id,offset] of [["prev",-1],["next",1]]){const b=$(id);let timer=null,at=0,ani=null;function clear(){clearTimeout(timer);cancelAnimationFrame(ani);timer=null;b.querySelector(".holdbar").style.width="0"}function start(e){if(b.disabled)return;if(e.button!==undefined&&e.button!==0)return;clear();at=performance.now();function frame(){const v=Math.min(100,(performance.now()-at)/7);b.querySelector(".holdbar").style.width=v+"%";if(v<100)ani=requestAnimationFrame(frame)}ani=requestAnimationFrame(frame);timer=setTimeout(()=>{navigate(day+offset);clear()},700)}b.addEventListener("pointerdown",start);["pointerup","pointercancel","pointerleave","blur"].forEach(t=>b.addEventListener(t,clear));b.addEventListener("click",e=>e.preventDefault())}
document.addEventListener("keydown",e=>{if(e.altKey||e.ctrlKey||e.metaKey)return;if(e.key==="ArrowRight")navigate(day+1);else if(e.key==="ArrowLeft")navigate(day-1)});
$("printgrid").innerHTML=DATA.map(d=>'<section class="printday"><h2>'+esc(d.day)+' '+esc(d.d)+'　'+esc(d.topic)+'</h2>'+[...d.read,...d.listen].map((w,i)=>'<div class="printrow"><div><span class="printeng">'+escapeWord(w)+'</span> <span class="printipa">/'+esc(w[1])+'/</span></div><span class="printzh">'+esc(w[2])+'</span></div>').join("")+'</section>').join("");
render();
</script></body></html>
