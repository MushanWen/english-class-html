<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>English Class HTML · Vercel Test</title>
  <style>
    :root { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f7f4ee;
      color: #1f2937;
    }
    .card {
      width: min(680px, calc(100% - 40px));
      padding: 40px;
      border-radius: 24px;
      background: white;
      box-shadow: 0 18px 50px rgba(0,0,0,.08);
      text-align: center;
    }
    h1 { margin: 0 0 16px; font-size: clamp(32px, 6vw, 56px); }
    p { font-size: 20px; line-height: 1.7; margin: 10px 0; }
    .stamp { margin: 18px auto 4px; padding: 12px 18px; border-radius: 14px; background: #f1f5f9; font-weight: 700; }
    button {
      margin-top: 18px;
      border: 0;
      border-radius: 999px;
      padding: 14px 24px;
      font-size: 18px;
      cursor: pointer;
      background: #111827;
      color: white;
    }
    #msg { margin-top: 16px; font-weight: 700; min-height: 1.5em; }
  </style>
</head>
<body>
  <main class="card">
    <h1>自动更新测试成功 🚀</h1>
    <p>这个页面已经由 ChatGPT 修改 GitHub 文件，并交给 Vercel 自动重新部署。</p>
    <div class="stamp">测试标记：2026-10-01 · GitHub → Vercel</div>
    <button onclick="document.getElementById('msg').textContent='交互功能正常 ✅'">测试点击</button>
    <div id="msg"></div>
  </main>
</body>
</html>
