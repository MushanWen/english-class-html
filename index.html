<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>English Class HTML · Vercel Test</title>
  <style>
    :root { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f7f4ee;
      color: #1f2937;
    }
    .card {
      width: min(680px, calc(100% - 40px));
      padding: 40px;
      border-radius: 24px;
      background: white;
      box-shadow: 0 18px 50px rgba(0,0,0,.08);
      text-align: center;
    }
    h1 { margin: 0 0 16px; font-size: clamp(32px, 6vw, 56px); }
    p { font-size: 20px; line-height: 1.7; margin: 10px 0; }
    button {
      margin-top: 18px;
      border: 0;
      border-radius: 999px;
      padding: 14px 24px;
      font-size: 18px;
      cursor: pointer;
      background: #111827;
      color: white;
    }
    #msg { margin-top: 16px; font-weight: 700; min-height: 1.5em; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Vercel 部署测试 🚀</h1>
    <p>如果你是在手机、平板或另一台电脑上通过网址看到这个页面，说明“ChatGPT → GitHub → Vercel”链路已经跑通。</p>
    <button onclick="document.getElementById('msg').textContent='交互功能正常 ✅'">测试点击</button>
    <div id="msg"></div>
  </main>
</body>
</html>
