<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>九年级英语 · 在线课件库</title>
  <style>
    :root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
    *{box-sizing:border-box}
    body{margin:0;background:#f7f3ea;color:#1f2937}
    .wrap{max-width:980px;margin:0 auto;padding:48px 24px 72px}
    header{margin-bottom:36px}
    h1{margin:0 0 10px;font-size:clamp(34px,6vw,58px);letter-spacing:-.03em}
    .sub{font-size:19px;line-height:1.7;color:#5f6672;margin:0}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
    .card{display:block;text-decoration:none;color:inherit;background:#fffdf8;border:1px solid #e7dfd0;border-radius:22px;padding:26px;box-shadow:0 10px 28px rgba(0,0,0,.05);transition:.18s ease}
    .card:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(0,0,0,.08)}
    .tag{display:inline-block;font-size:14px;font-weight:700;background:#eef2ff;padding:6px 10px;border-radius:999px;margin-bottom:14px}
    h2{font-size:25px;margin:0 0 10px}
    .desc{font-size:17px;line-height:1.65;color:#626975;margin:0}
    footer{margin-top:42px;color:#7a808b;font-size:14px}
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <h1>Grint · 九年级英语在线课件库</h1>
      <p class="sub">Grint的九年级英语在线课件库。点击课件即可直接打开，无需登录。</p>
    </header>
    <section class="grid">
      <a class="card" href="/lessons/unit5-reading/">
        <span class="tag">Unit 5 · Reading</span>
        <h2>Unit 5 3a 互动精读</h2>
        <p class="desc">Reading Engine V18｜证据定位、互动讲解、排序与 Word Bank 练习。</p>
      </a>
    </section>
    <footer>Grint · English Teaching Hub｜后续课件由 ChatGPT 维护并自动发布。</footer>
  </main>
</body>
</html>
